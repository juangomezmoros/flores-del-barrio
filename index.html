<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#18261c">
<title>Flores del Barrio</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b1d0e;--cream:#f6ecd0;--cream2:#e6d6ad;--green:#3d8f45;--bg:#18261c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);
    font-family:'Press Start 2P',ui-monospace,Menlo,monospace;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;background:#dfeecb}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;justify-content:flex-end;
    padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;pointer-events:none;z-index:2}
  #hud .sp{flex:1}
  .pill{background:rgba(24,38,28,.82);border:2px solid #0d150f;border-radius:20px;padding:7px 10px;font-size:11px;line-height:1;white-space:nowrap;color:#fff}
  .pill.mon{color:#ffe27a}
  .bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.18)}}
  #btnAlbum{pointer-events:auto;font-size:20px;line-height:1;background:rgba(24,38,28,.82);border:2px solid #0d150f;border-radius:20px;padding:5px 9px;cursor:pointer}
  #swipe{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;font-size:14px;color:#fff;
    text-shadow:0 2px 0 #2b1d0e,2px 0 0 #2b1d0e,-2px 0 0 #2b1d0e,0 -2px 0 #2b1d0e;pointer-events:none;z-index:2;animation:latido 1.4s infinite}
  @keyframes latido{50%{transform:scale(1.08)}}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);max-width:92vw;padding:9px 12px;font-size:9px;line-height:1.6;
    background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:8px;display:none;z-index:3;text-align:center}
  #creditos{position:fixed;left:6px;bottom:calc(env(safe-area-inset-bottom) + 4px);font-family:system-ui,sans-serif;font-size:9px;color:rgba(43,29,14,.6);pointer-events:none;z-index:1}
  button{font-family:inherit;cursor:pointer}
  .box{background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--cream2)}
  .btn{display:block;width:100%;margin-top:6px;padding:10px 6px;font-size:9px;line-height:1.5;background:var(--green);color:#fff;
    border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25);touch-action:manipulation}
  .btn.alt{background:var(--cream2);color:var(--ink)}
  .overlay{position:fixed;inset:0;background:rgba(10,18,12,.82);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
  #card{width:min(340px,100%);max-height:96vh;overflow:auto;padding:16px;text-align:center;font-size:9px;line-height:1.8}
  #card h2{font-size:12px;margin:10px 0 2px;line-height:1.5}
  #card em{font-family:Georgia,serif;font-size:13px;color:#6b5a3c}
  #card p{margin:10px 0}
  .pics{display:flex;gap:12px;justify-content:center;align-items:center}
  .pic{width:112px;height:112px;border:4px solid var(--ink)}
  #cardSprite{width:168px;height:168px;background:#f3ead2;padding:4px}
  #cardPhoto{display:none;object-fit:cover;image-rendering:pixelated}
  #cardStatus{color:var(--green)}
  #albumBox{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;padding:14px;font-size:9px}
  #albumBox h2{font-size:12px;margin:2px 0 4px;text-align:center}
  #albumSub{text-align:center;color:#6b5a3c;font-size:8px;margin-bottom:10px;line-height:1.6}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;overflow:auto;flex:1;min-height:0}
  .cell{background:#fff8e2;border:3px solid var(--ink);padding:8px 4px;text-align:center;font-size:7px;line-height:1.6;cursor:pointer}
  .cell canvas{width:64px;height:64px;display:block;margin:0 auto 6px}
  .cell small{display:block;color:#8a7f66;font-size:6px}
  .cell.no{background:#ddd0aa;color:#8a7f66;cursor:default}
  .cell.no .q{width:64px;height:64px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#b9ab84}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <button id="btnAlbum" title="Árboles del barrio">🌳</button><span class="sp"></span>
  <span class="pill mon" id="pMon">$0</span><span class="pill">🛒 <span id="pCarga">0/8</span></span><span class="pill">🚛 <span id="pCam">5d</span></span>
</div>
<div id="swipe">Arrastra para moverte</div>
<div id="toast"></div>
<div id="creditos">Datos: Jardín Botánico de Bogotá, IDRD · © OpenStreetMap</div>

<div class="overlay" id="cardOv">
  <div class="box" id="card">
    <div class="pics">
      <canvas class="pic" id="cardSprite" width="16" height="16"></canvas>
      <img class="pic" id="cardPhoto" alt="Tu foto">
    </div>
    <h2 id="cardName"></h2>
    <em id="cardSci"></em>
    <p id="cardFact"></p>
    <div id="cardStatus"></div>
    <button class="btn" id="btnFoto">REGISTRAR CON FOTO</button>
    <button class="btn alt" id="btnReg">REGISTRAR SIN FOTO</button>
    <button class="btn alt" id="btnClose">CERRAR</button>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>
</div>

<div class="overlay" id="albumOv">
  <div class="box" id="albumBox">
    <h2>ÁRBOLES DEL BARRIO</h2>
    <div id="albumSub"></div>
    <div id="grid"></div>
    <button class="btn alt" id="btnAlbumClose">CERRAR</button>
  </div>
</div>

<script src="data/mapa.js"></script>
<script>
if(!window.MAPA||!MAPA.calles){ document.body.innerHTML='<p style="padding:24px;line-height:2">Falta data/mapa.js. Ejecuta:<br>node scripts/descargar_datos.js<br>node scripts/construir_mapa.js</p>'; throw new Error('sin mapa'); }
</script>
<script src="especies.js"></script>
<script src="juego.js"></script>
</body>
</html>
